name: CI

# Runs this repository's existing self-checks on every push to main and every
# pull request. Everything here is headless and dependency-free: the sim
# harness is stdlib-only Python 3 (see README.md), so there is no install step
# beyond provisioning the interpreter.
#
# ---------------------------------------------------------------------------
# Self-check inventory
# ---------------------------------------------------------------------------
# Every self-check that exists in this repo is either run below or excluded
# here with a reason:
#
#   sim/tests/*.py (unittest, 71 cases)
#       RUN on every push/PR, on the oldest and newest supported Python.
#
#   sim/selftest.sh stage 1 (harness unit tests)
#       RUN on every push/PR (via sim/selftest.sh itself).
#
#   sim/tools/jitter_energy_law.py --check
#   sim/tools/array_sizing.py --check
#       RUN on every push/PR. Both are pure derivations over records already
#       committed under sim/records/ -- stdlib-only, no ngspice, no PDK,
#       sub-second. They are what keeps DR-0010's premise (the jitter-energy
#       invariant) and its sizing result (DR-0007 §2's inequality at the
#       entropy-binding corner) from rotting silently as records are appended:
#       without them the spec's central arithmetic is only checked by a human
#       who remembers to run it.
#
#   sim/selftest.sh stage 2 (python3 sim/run_corners.py --check-env)
#       RUN on every push/PR. On a hosted runner it reports ngspice/PDK
#       MISSING and the script exits 0 -- that skip path is exactly what CI
#       verifies, so a regression that made the harness hard-fail (or silently
#       "find" a PDK that isn't there) shows up as a red check.
#
#   sim/selftest.sh stage 3 (end-to-end smoke run, sim/tb/smoke-op)
#   sim/selftest.sh stage 4 (sim/tools/corner_sanity_check.py)
#       RUN on a schedule, not here: see .github/workflows/pdk-nightly.yml,
#       which provisions ngspice >= 46 and the gf180mcu PDK (pinned open_pdks
#       commit) and runs `sim/selftest.sh --require-pdk` -- the form that fails
#       instead of skipping. EXCLUDED from this PR-blocking path on purpose: a
#       source build plus a PDK download would cost minutes on every pull
#       request to exercise the harness, not the design.
#
#           sim/selftest.sh --require-pdk     # fails instead of skipping
#
#       That is also the command a contributor runs before committing any
#       evidence record (sim/README.md), and it is what `npm run check:all`
#       invokes; the nightly job does not replace the local pre-commit run.
#
#   design/interface/regmap.py --check (register-map staleness guard)
#       RUN on every push/PR, twice over: as its own step below, and inside
#       sim/tests/test_interface.py. It regenerates the interface block's
#       Verilog header and pinout document from the one normative table and
#       diffs them against what is committed -- stdlib-only, no external
#       tool, sub-second. Without it the RTL's addresses and the pinout #16
#       and #27 consume could drift apart silently.
#
#   design/netlist.py --check (schematic-vs-netlist staleness guard)
#       RUN on a schedule, not here: it shells out to xschem and resolves the
#       gf180mcu xschem symbol library through the PDK, neither of which this
#       PR-blocking path provisions -- same exclusion, and the same reason, as
#       selftest stages 3-4 above. See .github/workflows/pdk-nightly.yml. Its
#       *syntax* is still compiled here (the compileall step covers design/).
#
#   sim/run_corners.py evidence runs (sim/records/)
#       EXCLUDED from both workflows. Recording evidence is a deliberate,
#       PDK-bound act performed by a human or agent with the PDK installed;
#       records are append-only (sim/README.md) and CI must never mint them.
#       The scheduled job has the PDK and still does not: it runs selftest
#       without --record and fails if sim/records/ changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range. The harness uses
        # `from __future__ import annotations` throughout, so 3.10 is the
        # oldest interpreter it is known to run on.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (Python + shell)
        run: |
          python3 -m compileall -q design sim
          bash -n sim/selftest.sh

      - name: Harness unit tests
        run: python3 -m unittest discover -s sim/tests -t sim/tests

      # Derivations over committed sim/records/ only: no ngspice, no PDK, no
      # network, nothing written. jitter_energy_law.py --check fails if the
      # three record families it reads stop agreeing on the invariant DR-0010
      # calls `a`; array_sizing.py --check fails if the shipped array stops
      # satisfying DR-0007 §2 at any measured corner at DR-0010's rate, or if
      # its own copy of `a` has drifted from that derivation.
      - name: Spec arithmetic self-checks (jitter-energy law, array sizing)
        run: |
          python3 sim/tools/jitter_energy_law.py --check
          python3 sim/tools/array_sizing.py --check

      # The digital half's equivalent of design/netlist.py --check: the
      # interface block's Verilog header and pinout document are generated
      # from design/interface/regmap.py, and this fails if either is stale.
      # Unlike the netlist guard it needs no PDK and no external tool, so it
      # belongs on the PR-blocking path.
      - name: Register-map staleness guard
        run: python3 design/interface/regmap.py --check

      # sim/selftest.sh re-runs the unit tests as its own stage 1; the few
      # seconds of overlap buy coverage of the acceptance script itself --
      # its argument handling, its environment probe, and its PDK-absent skip
      # path (stages 3-4 self-skip and the script exits 0 on this runner).
      - name: Harness acceptance test (PDK stages self-skip on a hosted runner)
        run: sim/selftest.sh
