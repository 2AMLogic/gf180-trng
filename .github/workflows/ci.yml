name: CI

# Runs this repository's existing self-checks on every push to main and every
# pull request. Everything here is headless and dependency-free: the sim
# harness is stdlib-only Python 3 (see README.md), so there is no install step
# beyond provisioning the interpreter. Node/npm ship preinstalled on
# actions/runner-images ubuntu-latest, and this repo has no JS dependencies
# (package.json declares none), so `npm run <script>` needs no setup step
# either.
#
# Every check the harness job runs is written once, in sim/check.sh's `ci`
# group (issue #1000), and the job calls `sim/check.sh ci` instead of
# enumerating steps: the script prints a banner per step (`== npm run
# check:spec ==`, ...), so the log still shows which check failed under the
# single job step. This file is a runner over that list, not a second copy of
# it (issue #97 -- this job and `npm run check:ci` once enumerated two
# different sets of tools, and the fix then was to stop having two lists;
# issue #1000 applied the operator ruling recorded at 2AMLogic/2am#7561 --
# the commands are written once, in a script in the repository, and the
# workflow calls that script -- which deleted the parity test that held the
# copies together). The individual checks keep their named `npm run <script>`
# entry points in package.json, the inventory of what each check is.
#
# Two steps of the `ci` group have a form only this workflow uses, selected
# through the environment rather than by keeping a second copy of the list:
# SIM_CHECK_SHELL_STRICT=1 (shellcheck ships on this runner, so a missing
# binary must fail, not skip) and SIM_CHECK_EVIDENCE_BASE (the base SHA the
# evidence-history step compares sim/records/ against, computed below from
# the event -- it depends on github.event_*, which a local run does not have).
#
# ---------------------------------------------------------------------------
# Self-check inventory
# ---------------------------------------------------------------------------
# Every self-check that exists in this repo is either run below or excluded
# here with a reason:
#
#   sim/tests/*.py (unittest)
#       RUN on every push/PR, on the oldest and newest supported Python, via
#       the check list (`npm run test`). The tests that need an external
#       simulator (the RTL
#       equivalence classes need Icarus Verilog; two runner probes need
#       ngspice) SKIP here, since this job installs nothing. They run
#       strictly in pdk-nightly.yml, which installs both and sets
#       REQUIRE_RTL_TOOLS=1 so a missing tool fails instead of skipping
#       (#618). Every such gate goes through sim/tests/_tool_gate.py;
#       sim/tests/test_tool_gate_discipline.py fails on one that does not.
#
#   layout/tests/*.py (unittest)
#       RUN on every push/PR, on the oldest and newest supported Python, via
#       the check list (`npm run test:layout`). test_verify.py holds layout/verify.py's
#       freshness-gate comparison (`_stable()` / `compare_reports()`, issue
#       #148) to its own documented contract, with synthetic report payloads
#       -- no klt, no PDK, sub-second. Every machine-local field `_stable()`
#       claims to drop gets a case proving a payload that differs only there
#       still compares equal; every content-bearing field it claims to keep
#       (a verdict, a rule/error count, every content hash, the PDK variant
#       actually targeted) gets a case proving a payload that differs there
#       still compares unequal -- so a future edit that widens the drop-list
#       too far, turning the gate into a no-op, fails here before it can
#       ship. test_floorplan_netlist.py (issue #221) holds design/
#       floorplan_netlist.py's own `validate_inter_region_nets()` to the
#       same two-halves contract: the real, committed declaration must
#       validate clean, and a deliberately broken one (a typo'd pin, two
#       supply nets merged onto the same region, a missing `ro1` span flag,
#       ...) must be caught, not silently accepted.
#
#   sim/selftest.sh stage 1 (harness unit tests)
#       RUN on every push/PR (via sim/selftest.sh itself, the last step of
#       the check list).
#
#   python3 -m sim.tools.lint_shell (shell lint, #591)
#       RUN on every push/PR via the check list: shellcheck (warning
#       severity) over the tracked first-party *.sh files and shebang-carrying
#       scripts. ubuntu-latest ships shellcheck, so this workflow's
#       environment selects the strict form (SIM_CHECK_SHELL_STRICT=1, below)
#       in which a missing binary fails; `npm run check:ci` runs the lenient
#       form, which prints "shellcheck unavailable" and exits 0 when it is.
#
#   sim/tools/verify_record_checksums.py
#   sim/selftest.sh stage 2 (the same check, --no-git)
#       RUN on every push/PR. Re-hashes every file listed in every record's
#       raw.files against sim/records/raw/ and fails on a digest that no
#       longer matches, a listed file that is missing, an unlisted file
#       sitting in a raw directory, or raw output that was never committed.
#       Stdlib-only, no ngspice, no PDK, ~10s over the whole corpus. This is
#       what stops a record whose provenance is broken (#60: two concurrent
#       run_corners.py invocations overwriting each other's raw output) from
#       reaching main, where sim/records/ is append-only and a bad record can
#       only be superseded, never fixed. Run twice over, deliberately: as the
#       named entry point `npm run check:record-checksums` in the check list
#       (the strict form, which also checks git-commit state) and inside
#       sim/selftest.sh's stage 2 (--no-git, so a freshly minted but
#       not-yet-`git add`ed record does not fail an otherwise clean tree).
#
#   sim/tools/verify_artifact_manifests.py check (manifests/artifacts/,
#   DR-0032)
#       RUN on every push/PR via `npm run check:artifact-manifests`. New
#       evidence keeps its raw bytes in the artifact store; git holds a
#       manifest per run. Offline and stdlib-only: validates the manifest
#       schema, accepts only artifact: URIs, rejects storage names, and
#       fails if a stored object's bytes (or anything under the git-ignored
#       sim/.work/) are committed. Re-hashing against the store is `klt
#       artifact verify`, which needs the broker and so runs on a fleet
#       worker, not here.
#
#   sim/tools/verify_evidence_history.py (sim/records/ append-only vs base)
#       RUN on every push/PR via the check list. Append-only enforcement
#       (the record-checksum entry above only proves the CURRENT tree is
#       self-consistent; a rewritten record with matching hashes, or a
#       deleted record + raw directory, would still pass it). Compares
#       sim/records/ at HEAD with a base: the PR base SHA for pull_request,
#       the pre-push SHA for push -- computed in this workflow and handed to
#       the script through SIM_CHECK_EVIDENCE_BASE, since it is
#       event-dependent; locally the tool's own origin/main default applies.
#       A base that cannot be loaded (all-zero SHA on a first push, missing
#       history) is a failure rather than an empty diff -- see sim/README.md.
#
#   sim/tools/jitter_energy_law.py --check
#   sim/tools/starved_cell_jitter_energy.py --check
#   sim/tools/array_sizing.py --check
#   sim/tools/worst_corner_entropy.py --check
#   sim/tools/array_coupling_variants.py --check
#   sim/tools/array_coupling_buffer_variant.py --check
#   sim/tools/liveness_tap_phase_variants.py --check
#   sim/tools/array_liveness_tap_phase_variants.py --check
#   sim/tools/sampler_bit_bias_variants.py --check
#   sim/tools/time_to_first_valid.py --check
#   sim/tools/power_rollup.py --check
#   sim/tools/digital_corner_characterization.py --check
#   sim/tools/activity_power_characterization.py --check
#   sim/tools/vss_trunk_ir_drop.py --check
#   sim/tools/digital_supply_ir_drop.py --check
#   sim/tools/corpus_counts.py --check
#   sim/tools/klt_pin_sites.py --check
#   sim/tools/jitter_estimator_calibration_check.py --check
#   sim/tools/statistical_battery.py --check
#   sim/tools/higher_rate_options.py --check
#       RUN on every push/PR via `npm run check:spec` (package.json is the
#       single list of all twenty). Every one is a pure derivation over
#       records already committed under sim/records/ -- stdlib-only, no
#       ngspice, no PDK, sub-second -- so a newly appended record cannot
#       silently move a conclusion a summary document still asserts.
#       jitter_energy_law.py --check fails if the three record families it
#       reads stop agreeing on the invariant DR-0010 calls `a`;
#       array_sizing.py --check fails if the shipped array stops satisfying
#       DR-0007 §2 at any measured corner at DR-0010's rate, or if its own
#       copy of `a` has drifted from that derivation.
#       starved_cell_jitter_energy.py --check is the shipped starved-cell
#       counterpart of the plain-cell derivation `a` comes from: it fails if
#       the shipped ring's own starved-cell records stop agreeing with the
#       calibration jitter_energy_law.py derives.
#       worst_corner_entropy.py --check fails if the entropy-binding corner
#       (issue #13: the minimum-Q corner over the full covered 27-point PVT
#       grid) stops being the corner array_sizing.py's DR-0007 §2 inequality
#       actually binds on, or if a newly appended corner record beats it.
#       array_coupling_variants.py --check fails if the four DUT variants of
#       issue #51 stop classifying the way
#       sim/characterization-array-ring-coupling.md says they do -- i.e. if a
#       record moves the conclusion out from under a summary document that
#       still asserts it.
#       array_coupling_buffer_variant.py --check is the same guard for issue
#       #75's follow-on: it fails if the buffered variant stops isolating the
#       ring (sigma_1 no longer below the unbuffered variant's), or if
#       substituting the buffered array into the block's active rollup stops
#       being power-neutral-or-better -- the two claims
#       sim/characterization-ring-buffer-mitigation.md rests on. On a runner
#       with no PDK the digital term is unavailable, which changes both
#       rollup totals by the same constant and so leaves that comparison
#       valid.
#       liveness_tap_phase_variants.py --check is the same guard for issue
#       #76: it fails if the DUT variants of the DR-0016 liveness-digitizer
#       phase-cost experiment stop classifying the way
#       sim/characterization-liveness-tap-phase-cost.md says they do -- either
#       the clk-locked finding on the pre-#82 direct tap, or the separate
#       finding about how much of it the buffer #82 adopted removes.
#       array_liveness_tap_phase_variants.py --check is issue #87's equivalent
#       guard on the SHIPPED topology -- whether the shipped clk-locked
#       residual comes in below the 19.9x upper bound #76 recorded for it (it
#       does, at 3.46x), and whether the xsb-on-xo raw-tap path reaches either
#       ring node (it does not: 0.96x, unreachable at this corner). It was
#       deliberately withheld from the list while the xsb pair was still
#       running, because --check requires BOTH verdicts and exits non-zero
#       while either RECORDED_*_VERDICT is None -- a half-armed gate that
#       passed on the half it cannot see would be worse than no gate. Both
#       pairs have landed and both verdicts are recorded, so the line is on
#       the list now.
#       sampler_bit_bias_variants.py --check is issue #86's guard, one level
#       downstream of #76's: it fails if the sampled bit at the DR-0001 raw
#       tap stops behaving the way sim/characterization-sampler-bit-bias.md
#       says it does when the DR-0016 liveness digitizers' clock is running
#       rather than parked -- i.e. if a future record turns that null into a
#       measured bias, which would put a term into DR-0007 §1's independence
#       argument. It also fails on a record whose sampled levels never
#       settled to a rail, since bit statistics taken off a metastable capture
#       are not bit statistics.
#       time_to_first_valid.py --check fails if any start-up corner stops
#       converging, if the ring swing stops being settled by the early
#       window, or if the measured total drops below the README's arithmetic
#       floor (which claims to be a lower bound, so falling under it would
#       make the ratified row wrong rather than conservative).
#       power_rollup.py --check fails on a missing corner, on an idle record
#       whose two measurement windows disagree (its own static-state
#       self-check), or on a sampler record that never witnessed a capture.
#       It deliberately does NOT fail on a README row being missed -- the idle
#       row IS missed, by 4.5x, and that is routed through DR-0017 rather than
#       through a red build. It degrades to the measured-silicon-only view on
#       a runner with no PDK and therefore no Liberty library.
#       higher_rate_options.py --check (issue #629) fails if the starved-cell
#       constant it sizes with drifts from starved_cell_jitter_energy.py, if
#       its law stops reproducing the shipped ring count, or if any figure
#       docs/higher-rate-source-options-study.md quotes stops reproducing
#       from the committed records it reads.
#       jitter_estimator_calibration_check.py checks the committed
#       jitter-estimator-calibration record against its closed-form
#       Phi(bias/NA) prediction (DR-0012); statistical_battery.py self-tests
#       its SP 800-22-style tests and incomplete-gamma against math.erfc.
#
#   sim/selftest.sh stage 3 (python3 sim/run_corners.py --check-env)
#       RUN on every push/PR. On a hosted runner it reports ngspice/PDK
#       MISSING and the script exits 0 -- that skip path is exactly what CI
#       verifies, so a regression that made the harness hard-fail (or silently
#       "find" a PDK that isn't there) shows up as a red check.
#
#   sim/selftest.sh stage 4 (end-to-end smoke run, sim/tb/smoke-op)
#   sim/selftest.sh stage 5 (sim/tools/corner_sanity_check.py)
#       RUN on a schedule, not here: see .github/workflows/pdk-nightly.yml,
#       which provisions ngspice >= 46 and the gf180mcu PDK (pinned open_pdks
#       commit) and runs `sim/selftest.sh --require-pdk` -- the form that fails
#       instead of skipping. EXCLUDED from this PR-blocking path on purpose: a
#       source build plus a PDK download would cost minutes on every pull
#       request to exercise the harness, not the design.
#
#           sim/selftest.sh --require-pdk     # fails instead of skipping
#
#       That is also the command a contributor runs before committing any
#       evidence record (sim/README.md), and it is what the `all` group of
#       sim/check.sh invokes; the nightly job does not replace the local
#       pre-commit run.
#
#   sim/tools/verify_report_host_paths.py (generated-report host-path guard)
#       RUN on every push/PR via `npm run check:no-host-paths`. Tracked
#       generated JSON under design/, layout/ and signoff/ must not embed
#       absolute /home/<user>/ or /Users/<user>/ paths. One historical
#       native response is exempt by exact path and SHA-256. Stdlib only.
#
#   layout/digital/build.py --check-input (digital P&R input-netlist
#   staleness guard, #293)
#       RUN on every push/PR via `npm run check:digital-input`.
#       layout/digital/reports/place_and_route.json records the sha256 of
#       the netlist place-and-route consumed, and this fails if
#       design/trng_top/trng_top.synth.v has since been re-synthesized
#       without the implementation being re-run. Pure stdlib -- no OpenROAD,
#       no klt.
#
#   design/interface/regmap.py --check (register-map staleness guard)
#       RUN on every push/PR, twice over: in the check list (via `npm run
#       check:regmap`), and inside sim/tests/test_interface.py. It regenerates
#       the interface block's Verilog header and pinout document from the one
#       normative table and diffs them against what is committed -- stdlib-
#       only, no external tool, sub-second. Without it the RTL's addresses and
#       the pinout #16 and #27 consume could drift apart silently.
#
#   design/floorplan_netlist.py --check (trng_floorplan inter-region net
#       list self-check, issue #221)
#       RUN on every push/PR via `npm run check:floorplan-netlist`. Verifies
#       every declared `(region_id, region_pin_name)` endpoint in
#       `INTER_REGION_NETS` actually names a real pin on that region's own
#       committed reference `.spice` file (`layout/rings/ro_ring11/
#       ro_ring11.spice`, `layout/rings/ro_ring11_ring2/
#       ro_ring11_ring2.spice`, `layout/blocks/combiner_sampler/
#       combiner_sampler.spice`, `layout/digital/trng_top.lvs_reference.
#       spice`) and that the composed `layout/floorplan/trng_floorplan.
#       lvs_reference.spice` matches what the declaration currently
#       generates -- stdlib-only, no klt, no PDK, sub-second. This is
#       phase 1 of issue #219's floorplan-composition epic: a data/
#       rationale declaration, not yet drawn geometry or a DRC/LVS run
#       (phase 2, a separate follow-up issue).
#
#   design/netlist.py --check (schematic-vs-netlist staleness guard)
#       RUN on a schedule, not here: it shells out to xschem and resolves the
#       gf180mcu xschem symbol library through the PDK, neither of which this
#       PR-blocking path provisions -- same exclusion, and the same reason, as
#       selftest stages 4-5 above. See .github/workflows/pdk-nightly.yml. Its
#       *syntax* is still compiled here (the compileall step covers design/).
#       Deliberately absent from the `ci` group of sim/check.sh too (only its
#       `all` group runs it, as `check:netlist`) -- adding it there would make
#       the local pre-push command need the PDK, which is exactly what the
#       `ci` group exists to avoid.
#
#   design/netlist.py --lint (schematic T {...} text-block brace guard)
#       RUN on every push/PR, folded into `npm run lint`'s chain (package.json)
#       and so into the check list. Unlike --check above, this is a
#       pure-Python scan of the schematics' own text for a stray brace inside
#       a T {...} free-text block -- no xschem, no PDK. A brace there (even a
#       balanced pair) makes xschem's own parser miscount and silently corrupt
#       the exported netlist with no error from either tool (#61), so this
#       catches it at the point a schematic comment is authored rather than
#       the next scheduled pdk-nightly.yml run.
#
#   sim/tools/unused_names.py --check (unused import / local guard, #494)
#   sim/tools/verify_markdown_links.py --check (relative link guard, #570)
#   sim/tools/pathload_guard.py --check (hand-copied path-loader guard, #553)
#   sim/tools/workflow_yaml_guard.py --check (workflow name-scalar guard,
#       #1003)
#       RUN on every push/PR, folded into `npm run lint`'s chain (package.json)
#       and so into the check list; all are stdlib-only and need no
#       PDK. verify_markdown_links walks the git-tracked *.md files (outside
#       the append-only sim/records/ tree and the installed .loom/, .claude/
#       and .agents/ surfaces) and fails on any relative inline link or
#       reference-style definition whose target is not a tracked file or
#       directory -- decision-record citations in evidence summaries are the
#       audit trail for spec claims, and nothing else checks they resolve.
#       File existence only; anchors are out of scope.
#       workflow_yaml_guard scans these tracked workflow files for a plain
#       (unquoted, non-block) `name:` value containing ": " -- a defect that
#       makes the file unparseable, so the run is a startup failure with
#       zero jobs and no required context ever reports (#1003); it is the
#       one failure mode no check inside the workflow can see, because the
#       workflow is what runs the checks.
#
#   layout/testcells/build.py --check (layout test-cell staleness guard)
#   layout/verify.py (DRC/LVS flow, self-skips without klt/the PDK)
#   layout/floorplan/floorplan.py (floorplan abstract + area rollup, same
#       self-skip pattern as layout/verify.py)
#       RUN on every push/PR via `npm run check:fixtures` / `check:layout` /
#       `check:floorplan` respectively. None needs the PDK to at least run its
#       own argument handling, tool probe and skip path -- a skip is not a
#       pass, so exercising the skip path itself is still worth a green check
#       here; the `all` group runs the latter two with --require-tools
#       locally.
#
#   layout/digital/tap_distance.py --check (tap-distance report freshness)
#       RUN on every push/PR via `npm run check:digital-tap-distance`, which
#       self-skips (explicitly, on stderr) when the `klayout` Python module is
#       absent, as on this runner. The mandatory `--check --require-tools`
#       form runs in the provisioned nightly layout job (pdk-nightly.yml),
#       where a missing module fails rather than skips. It only compares and
#       never rewrites the committed report. It judges report freshness, not
#       physical compliance (a current report may still disclose a failing
#       verdict; that decision is tracked separately).
#
#   signoff/check.py (T1 tier-report re-grade + evidence-freshness gate)
#       RUN on every push/PR, in its own `signoff` job below, with
#       --require-tools. It is not in the `harness` matrix because it is the
#       one check here that installs a third-party tool (klayout-tools, the
#       grader), and paying that install twice over the Python matrix buys
#       nothing. Two halves, both PR-blocking:
#         1. stdlib-only, no tool needed -- re-hash every input artifact a
#            cited evidence envelope names (a GDS, a Markdown characterization
#            record) and fail if it no longer matches the digest that envelope
#            recorded. `klt signoff` compares the manifest's pin against the
#            envelope's own provenance block and never opens the artifact
#            underneath, so without this step two committed files could agree
#            with each other while both described a revision that no longer
#            exists.
#         2. re-run `klt signoff --manifest signoff/block-manifest.json` and
#            fail if signoff/records/t1-tier-report.json -- this block's T1
#            verdict of record, cited by the gap-to-T1 tracker (#124) -- no
#            longer matches. That is what stops the verdict from rotting back
#            into prose the way a hand-maintained checkbox list does.
#       The grader needs no PDK and no KLayout GUI; it only reads JSON
#       envelopes already committed here. See signoff/README.md.
#
#   sim/run_corners.py evidence runs (sim/records/)
#       EXCLUDED from both workflows. Recording evidence is a deliberate,
#       PDK-bound act performed by a human or agent with the PDK installed;
#       records are append-only (sim/README.md) and CI must never mint them.
#       The scheduled job has the PDK and still does not: it runs selftest
#       without --record and fails if sim/records/ changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Hang guard, not a budget. Healthy runs of this job take 47-83 s across
    # both Python versions (last 20 successful runs); 5 min is ~3.5x the
    # slowest, so suite growth and a cold runner do not trip it, but a stuck
    # step fails in minutes instead of holding the runner and the
    # `ci-<ref>` concurrency group for GitHub's 360-minute default.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range. The harness uses
        # `from __future__ import annotations` throughout, so 3.10 is the
        # oldest interpreter it is known to run on.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the evidence-history step of the check list needs
          # the PR base (or pushed-from) commit and a merge-base with HEAD.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # The PR-blocking check list, written once in sim/check.sh's `ci` group
      # (#1000): lint (Python/shell syntax, the schematic brace guard, the
      # unused-name, pathload, markdown-link and workflow name-scalar guards),
      # shell lint, the
      # harness and layout unit tests, the spec arithmetic, the
      # record/artifact/regmap/floorplan-netlist/digital-input/host-path
      # guards, the DRC/LVS/floorplan/tap-distance self-skip drivers, the
      # signoff freshness half, and sim/selftest.sh's PDK-absent skip path.
      # The script prints a banner per step, so a failure still names the
      # check that failed. The two environment variables select this
      # workflow's forms: SIM_CHECK_SHELL_STRICT=1 makes a missing shellcheck
      # a failure (shellcheck ships on this runner), and
      # SIM_CHECK_EVIDENCE_BASE carries the append-only base revision --
      # event-dependent, so the case below computes it here: the PR base SHA
      # for pull_request, the pushed-from SHA for push, origin/main for any
      # other event. A base that cannot be resolved is a failure, not an
      # empty diff (see sim/README.md).
      - name: "Self-checks (the one check list: sim/check.sh ci)"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="origin/main" ;;
          esac
          if [ -z "$base" ]; then
            echo "ERROR: no base revision for event $EVENT_NAME" >&2
            exit 2
          fi
          export SIM_CHECK_EVIDENCE_BASE="$base" SIM_CHECK_SHELL_STRICT=1
          sim/check.sh ci

  # ---------------------------------------------------------------------------
  # T1 evidence signoff. Separate job because it is the only check here that
  # installs a third-party tool; see the self-check inventory above.
  # ---------------------------------------------------------------------------
  signoff:
    name: T1 tier report (klt signoff --manifest, no PDK required)
    runs-on: ubuntu-latest
    # Hang guard, not a budget. Healthy runs take 9-14 s (last 20 successful
    # runs, dominated by the klayout-tools install); 2 min leaves room for a
    # slow package-index fetch while still failing a stuck step quickly.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # signoff/check.py pins the klayout-tools release that GRADES this
      # block, and that pin is load-bearing rather than incidental: `klt
      # signoff` parses the T1 item list out of klayout-tools' own
      # docs/design-evidence-tiers.md, bundled inside the wheel, so the tool
      # version IS the yardstick. 0.5.0 renders a ten-item checklist with no
      # item-11 row at all (T1 item 11, "Power delivery (structural)",
      # klayout-tools#2025, landed after that release); 0.6.0 renders eleven;
      # 0.7.0 is the first release that grades the artifact-anchored generic
      # envelopes behind T1 items 1, 2, 9 and 10 (#653).
      # Keep this version in step with signoff/check.py's KLT_GRADER_PIN -- the
      # committed record carries build.version, so a mismatch fails loudly at
      # the record diff rather than grading against the wrong checklist in
      # silence.
      #
      # This is deliberately a SEPARATE pin from pdk-nightly.yml's
      # klayout-tools pin, which pins the build that PRODUCES layout
      # evidence (DRC/LVS/extraction), signoff/check.py's KLT_PIN (DR-0026, as
      # amended: 0.6.0). From #281 to #653 both named the same release; they no
      # longer do, because they have different jobs and move on different
      # clocks: bumping the producer means re-running
      # DRC/LVS and re-committing evidence, bumping the grader re-reads
      # existing evidence and produces none. Do not move one because the
      # other moved.
      - name: Install the pinned signoff grader (klt; no PDK, no KLayout GUI)
        run: pip install "klayout-tools==0.8.0"  # klt-pin: grader

      # Runs with --require-tools so the tool-absent self-skip path can never
      # stand in for a pass here. Fails on evidence rot (a cited envelope's
      # input artifact changed underneath it) or verdict rot (a fresh
      # `klt signoff` run no longer matches the committed record).
      - name: T1 manifest re-grade and evidence-freshness gate
        run: python3 signoff/check.py --require-tools
