name: CI

# Runs this repository's existing self-checks on every push to main and every
# pull request. Everything here is headless and dependency-free: the sim
# harness is stdlib-only Python 3 (see README.md), so there is no install step
# beyond provisioning the interpreter.
#
# ---------------------------------------------------------------------------
# Self-check inventory
# ---------------------------------------------------------------------------
# Every self-check that exists in this repo is either run below or excluded
# here with a reason:
#
#   sim/tests/*.py (unittest, 71 cases)
#       RUN on every push/PR, on the oldest and newest supported Python.
#
#   sim/selftest.sh stage 1 (harness unit tests)
#       RUN on every push/PR (via sim/selftest.sh itself).
#
#   sim/tools/verify_record_checksums.py
#   sim/selftest.sh stage 2 (the same check, --no-git)
#       RUN on every push/PR. Re-hashes every file listed in every record's
#       raw.files against sim/records/raw/ and fails on a digest that no
#       longer matches, a listed file that is missing, an unlisted file
#       sitting in a raw directory, or raw output that was never committed.
#       Stdlib-only, no ngspice, no PDK, ~10s over the whole corpus. This is
#       what stops a record whose provenance is broken (#60: two concurrent
#       run_corners.py invocations overwriting each other's raw output) from
#       reaching main, where sim/records/ is append-only and a bad record can
#       only be superseded, never fixed.
#
#   sim/tools/jitter_energy_law.py --check
#   sim/tools/array_sizing.py --check
#       RUN on every push/PR. Both are pure derivations over records already
#       committed under sim/records/ -- stdlib-only, no ngspice, no PDK,
#       sub-second. They are what keeps DR-0010's premise (the jitter-energy
#       invariant) and its sizing result (DR-0007 §2's inequality at the
#       entropy-binding corner) from rotting silently as records are appended:
#       without them the spec's central arithmetic is only checked by a human
#       who remembers to run it.
#
#   sim/selftest.sh stage 3 (python3 sim/run_corners.py --check-env)
#       RUN on every push/PR. On a hosted runner it reports ngspice/PDK
#       MISSING and the script exits 0 -- that skip path is exactly what CI
#       verifies, so a regression that made the harness hard-fail (or silently
#       "find" a PDK that isn't there) shows up as a red check.
#
#   sim/selftest.sh stage 4 (end-to-end smoke run, sim/tb/smoke-op)
#   sim/selftest.sh stage 5 (sim/tools/corner_sanity_check.py)
#       RUN on a schedule, not here: see .github/workflows/pdk-nightly.yml,
#       which provisions ngspice >= 46 and the gf180mcu PDK (pinned open_pdks
#       commit) and runs `sim/selftest.sh --require-pdk` -- the form that fails
#       instead of skipping. EXCLUDED from this PR-blocking path on purpose: a
#       source build plus a PDK download would cost minutes on every pull
#       request to exercise the harness, not the design.
#
#           sim/selftest.sh --require-pdk     # fails instead of skipping
#
#       That is also the command a contributor runs before committing any
#       evidence record (sim/README.md), and it is what `npm run check:all`
#       invokes; the nightly job does not replace the local pre-commit run.
#
#   design/interface/regmap.py --check (register-map staleness guard)
#       RUN on every push/PR, twice over: as its own step below, and inside
#       sim/tests/test_interface.py. It regenerates the interface block's
#       Verilog header and pinout document from the one normative table and
#       diffs them against what is committed -- stdlib-only, no external
#       tool, sub-second. Without it the RTL's addresses and the pinout #16
#       and #27 consume could drift apart silently.
#
#   design/netlist.py --check (schematic-vs-netlist staleness guard)
#       RUN on a schedule, not here: it shells out to xschem and resolves the
#       gf180mcu xschem symbol library through the PDK, neither of which this
#       PR-blocking path provisions -- same exclusion, and the same reason, as
#       selftest stages 4-5 above. See .github/workflows/pdk-nightly.yml. Its
#       *syntax* is still compiled here (the compileall step covers design/).
#
#   design/netlist.py --lint (schematic T {...} text-block brace guard)
#       RUN on every push/PR, as its own step below. Unlike --check above,
#       this is a pure-Python scan of the schematics' own text for a stray
#       brace inside a T {...} free-text block -- no xschem, no PDK. A brace
#       there (even a balanced pair) makes xschem's own parser miscount and
#       silently corrupt the exported netlist with no error from either tool
#       (#61), so this catches it at the point a schematic comment is
#       authored rather than the next scheduled pdk-nightly.yml run.
#
#   sim/run_corners.py evidence runs (sim/records/)
#       EXCLUDED from both workflows. Recording evidence is a deliberate,
#       PDK-bound act performed by a human or agent with the PDK installed;
#       records are append-only (sim/README.md) and CI must never mint them.
#       The scheduled job has the PDK and still does not: it runs selftest
#       without --record and fails if sim/records/ changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of the supported range. The harness uses
        # `from __future__ import annotations` throughout, so 3.10 is the
        # oldest interpreter it is known to run on.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (Python + shell)
        run: |
          python3 -m compileall -q design sim layout
          bash -n sim/selftest.sh

      - name: Harness unit tests
        run: python3 -m unittest discover -s sim/tests -t sim/tests

      # Derivations over committed sim/records/ only: no ngspice, no PDK, no
      # network, nothing written. jitter_energy_law.py --check fails if the
      # three record families it reads stop agreeing on the invariant DR-0010
      # calls `a`; array_sizing.py --check fails if the shipped array stops
      # satisfying DR-0007 §2 at any measured corner at DR-0010's rate, or if
      # its own copy of `a` has drifted from that derivation.
      # array_coupling_variants.py --check fails if the four DUT variants of
      # issue #51 stop classifying the way sim/characterization-array-ring-
      # coupling.md says they do -- i.e. if a record moves the conclusion out
      # from under a summary document that still asserts it.
      # array_coupling_buffer_variant.py --check is the same guard for issue
      # #75's follow-on: it fails if the buffered variant stops isolating the
      # ring (sigma_1 no longer below the unbuffered variant's), or if
      # substituting the buffered array into the block's active rollup stops
      # being power-neutral-or-better -- the two claims
      # sim/characterization-ring-buffer-mitigation.md rests on. On a runner
      # with no PDK the digital term is unavailable, which changes both rollup
      # totals by the same constant and so leaves that comparison valid.
      # liveness_tap_phase_variants.py --check is the same guard for issue #76:
      # it fails if the DUT variants of the DR-0016 liveness-digitizer
      # phase-cost experiment stop classifying the way
      # sim/characterization-liveness-tap-phase-cost.md says they do -- either
      # the clk-locked finding on the pre-#82 direct tap, or the separate
      # finding about how much of it the buffer #82 adopted removes.
      # array_liveness_tap_phase_variants.py --check is issue #87's equivalent
      # guard on the SHIPPED topology -- whether the shipped clk-locked residual
      # comes in below the 19.9x upper bound #76 recorded for it, and whether the
      # xsb-on-xo path reaches either ring node. It is deliberately NOT on the
      # list below: its four decks exist but have not been run, so there is no
      # record for it to read and no recorded verdict for it to gate against
      # (both RECORDED_* constants are None, and
      # sim/characterization-shipped-array-tap-phase.md's Results section says
      # why). Adding the line here belongs to the change that lands the records.
      # sampler_bit_bias_variants.py --check is issue #86's guard, one level
      # downstream of #76's: it fails if the sampled bit at the DR-0001 raw tap
      # stops behaving the way sim/characterization-sampler-bit-bias.md says it
      # does when the DR-0016 liveness digitizers' clock is running rather than
      # parked -- i.e. if a future record turns that null into a measured bias,
      # which would put a term into DR-0007 §1's independence argument. It also
      # fails on a record whose sampled levels never settled to a rail, since
      # bit statistics taken off a metastable capture are not bit statistics.
      # time_to_first_valid.py --check fails if any start-up corner stops
      # converging, if the ring swing stops being settled by the early window,
      # or if the measured total drops below the README's arithmetic floor
      # (which claims to be a lower bound, so falling under it would make the
      # ratified row wrong rather than conservative).
      # power_rollup.py --check fails on a missing corner, on an idle record
      # whose two measurement windows disagree (its own static-state
      # self-check), or on a sampler record that never witnessed a capture. It
      # deliberately does NOT fail on a README row being missed -- the idle row
      # IS missed, by 4.5x, and that is routed through DR-0017 rather than
      # through a red build. It degrades to the measured-silicon-only view on
      # this runner, which has no PDK and therefore no Liberty library.
      - name: Spec arithmetic self-checks (jitter-energy law, array sizing, ring coupling, #14 rollups)
        run: |
          python3 sim/tools/jitter_energy_law.py --check
          python3 sim/tools/array_sizing.py --check
          python3 sim/tools/array_coupling_variants.py --check
          python3 sim/tools/array_coupling_buffer_variant.py --check
          python3 sim/tools/liveness_tap_phase_variants.py --check
          python3 sim/tools/sampler_bit_bias_variants.py --check
          python3 sim/tools/time_to_first_valid.py --check
          python3 sim/tools/power_rollup.py --check

      # Ties every record's numbers to the raw ngspice output it cites: each
      # file listed in raw.files is re-hashed against sim/records/raw/, and a
      # mismatch, a missing file, an unlisted file in a raw directory, or raw
      # output that was never committed fails the run. sim/records/ is
      # append-only, so a record with broken provenance that reaches main can
      # only be superseded -- this is the gate that keeps one out (#60).
      - name: Record checksum verification (sim/records/ raw.files)
        run: python3 sim/tools/verify_record_checksums.py --quiet

      # The digital half's equivalent of design/netlist.py --check: the
      # interface block's Verilog header and pinout document are generated
      # from design/interface/regmap.py, and this fails if either is stale.
      # Unlike the netlist guard it needs no PDK and no external tool, so it
      # belongs on the PR-blocking path.
      - name: Register-map staleness guard
        run: python3 design/interface/regmap.py --check

      # Pure-Python, no xschem, no PDK: fails if any design/xschem/*.sch's
      # T {...} free-text block contains a stray brace, which xschem's own
      # parser silently mis-handles and turns into a corrupted netlist (#61).
      - name: Schematic text-block brace guard
        run: python3 design/netlist.py --lint

      # The layout equivalent of the register-map guard: layout/testcells/*.gds
      # are generated by layout/testcells/build.py and every committed DRC/LVS
      # report is only meaningful for the exact stream it ran on, so a geometry
      # edit that was not regenerated must fail here. Pure stdlib -- no PDK, no
      # klayout-tools, no network -- so it belongs on the PR-blocking path.
      - name: Layout test-cell staleness guard
        run: python3 layout/testcells/build.py --check

      # Runs the DRC/LVS flow when klayout-tools and the PDK are present, and
      # self-skips with exit 0 when they are not (this runner has neither).
      # Included for the same reason selftest.sh is: it covers the driver's own
      # argument handling, tool probe, and skip path. A skip is not a pass --
      # `npm run check:all` runs it with --require-tools locally.
      - name: Layout DRC/LVS flow (self-skips on a hosted runner)
        run: python3 layout/verify.py

      # sim/selftest.sh re-runs the unit tests and the record-checksum check
      # as its own stages 1-2; the few seconds of overlap buy coverage of the
      # acceptance script itself -- its argument handling, its environment
      # probe, and its PDK-absent skip path (stages 4-5 self-skip and the
      # script exits 0 on this runner).
      - name: Harness acceptance test (PDK stages self-skip on a hosted runner)
        run: sim/selftest.sh
