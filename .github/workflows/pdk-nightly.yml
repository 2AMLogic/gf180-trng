name: PDK nightly

# The PDK-dependent half of this repository's self-checks, deliberately kept
# off the pull-request path.
#
# `sim/selftest.sh` stage 4 (end-to-end smoke run) and stage 5 (the
# corner-sanity guardrail) need ngspice >= 46 and the gf180mcu PDK. On the PR
# path they self-skip, so nothing exercises them unattended -- see the
# self-check inventory at the top of ci.yml. This workflow provisions both and
# runs `sim/selftest.sh --require-pdk`, which fails instead of skipping.
#
#
# `design/netlist.py --check` is here for the same reason. It re-exports every
# top cell in design/xschem/ and fails if the committed design/*.spice disagrees
# with the schematic it claims to come from -- which is what makes the
# `netlist.sha` recorded in every evidence record mean something. It shells out
# to xschem and resolves the gf180mcu xschem symbol library through the PDK, so
# it cannot run on the PR path.
#
# It has no `push` / `pull_request` trigger by construction: a pull request
# must never block on a source build plus a PDK download.
#
# Everything external is pinned so a version change is a visible commit rather
# than silent drift:
#
#   NGSPICE_VERSION / NGSPICE_SHA256  the ngspice release tarball and its digest
#   PDK_VERSION                       the open_pdks commit the PDK build is cut from
#   CIEL_VERSION                      the PDK version manager itself
#
# Every pin is part of the cache key it belongs to, so a stale cache cannot mask
# a bump.
#
# xschem is the one exception: it comes from the runner's distro rather than a
# pin, because it is a netlister and not a numerical tool. Its output formatting
# is an input to the staleness comparison, so a distro version bump can turn
# this job red without any schematic having changed. That is the intended
# failure mode -- loud rather than silent. The fix in that case is to regenerate
# with `python3 design/netlist.py` and commit the diff, noting the version bump.
# The step below prints the version it used.
#
# This job writes no evidence records. `sim/records/` is append-only and minted
# deliberately by a human or agent with the PDK installed (sim/README.md), never
# by CI: selftest is invoked without `--record`, and the last step fails the job
# if anything appeared under `sim/records/` regardless.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. If this stops running, re-enable it from the Actions tab.

on:
  schedule:
    # 07:27 UTC daily. Off the hour on purpose -- the shared scheduler is
    # congested on the hour and delays runs queued there.
    - cron: "27 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One provisioning run at a time; never cancel one in flight, since a
  # cancelled cold run leaves the caches unpopulated for the next.
  group: pdk-nightly
  cancel-in-progress: false

jobs:
  selftest:
    name: sim/selftest.sh --require-pdk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # README.md requires ngspice 46 or newer; ubuntu-latest ships older, so
      # this is a source build of the pinned release.
      NGSPICE_VERSION: "46"
      NGSPICE_SHA256: "a0d1699af1940b06649276dcd6ff5a566c8c0cad01b2f7b5e99dedbb4d64c19b"
      CIEL_VERSION: "2.6.1"
      # open_pdks commit; the matching PDK build is published as
      # https://github.com/fossi-foundation/ciel-releases/releases/tag/gf180mcu-<PDK_VERSION>
      PDK_VERSION: "f6eeac7dad085ffcc829ccfd721f7b4ce39edcf7"
      # The harness needs the device models under <variant>/libs.tech/ngspice,
      # which ride in the release's `common` tarball (always fetched), plus the
      # primitive library. No sim/tb testbench uses standard cells, IO or SRAM,
      # so the rest of the ~5 GB default set would be skipped -- except that
      # two PDK-dependent steps below each need one more of them:
      # `gf180mcu_fd_sc_mcu9t5v0`, the digital standard-cell library `klt
      # synthesize` maps trng_top's RTL onto (`design/synth.py --check`, #143),
      # and `gf180mcu_fd_sc_mcu7t5v0`, whose LEF `layout/floorplan/floorplan.py`
      # reads to price cell areas (`area_estimate.STDCELL_LIB`, #310).
      # Space-separated; each name becomes its own `-l` flag in the `ciel
      # enable` step below (`-l` takes one library per flag -- `ciel enable
      # --help`).
      PDK_LIBRARIES: "gf180mcu_fd_pr gf180mcu_fd_sc_mcu9t5v0 gf180mcu_fd_sc_mcu7t5v0"
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Resolve install prefix
        run: echo "NGSPICE_PREFIX=${HOME}/.local/ngspice-${NGSPICE_VERSION}" >> "${GITHUB_ENV}"

      - name: Cache ngspice build
        id: cache-ngspice
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.NGSPICE_PREFIX }}
          key: ngspice-${{ env.NGSPICE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build ngspice ${{ env.NGSPICE_VERSION }} from source
        if: steps.cache-ngspice.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex
          tarball="ngspice-${NGSPICE_VERSION}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "${tarball}" \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/${NGSPICE_VERSION}/${tarball}"
          echo "${NGSPICE_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}"
          cd "ngspice-${NGSPICE_VERSION}"
          # Batch-mode simulator only: no X11, no readline. XSPICE is enabled
          # because open_pdks device models may use its extensions.
          ./configure \
            --prefix="${NGSPICE_PREFIX}" \
            --with-x=no \
            --with-readline=no \
            --enable-xspice \
            --disable-debug
          make -j"$(nproc)"
          make install

      - name: Put ngspice on PATH and enforce the minimum version
        run: |
          set -euo pipefail
          echo "${NGSPICE_PREFIX}/bin" >> "${GITHUB_PATH}"
          out="$("${NGSPICE_PREFIX}/bin/ngspice" --version)"
          printf '%s\n' "${out}" | head -n 3
          major="$(printf '%s\n' "${out}" | sed -n 's/.*ngspice-\([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 46 ]; then
            echo "FAIL: ngspice >= 46 required (README.md), found: ${major:-unparseable}"
            exit 1
          fi

      - name: Cache gf180mcu PDK
        id: cache-pdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ciel
          key: pdk-gf180mcu-${{ env.PDK_VERSION }}-${{ env.PDK_LIBRARIES }}-ciel${{ env.CIEL_VERSION }}

      - name: Provision the gf180mcu PDK at the pinned open_pdks commit
        env:
          # Rate-limit headroom for the GitHub API calls ciel makes. httpx drops
          # the Authorization header on the cross-host redirect to the release
          # asset CDN, so the token never leaves github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "ciel==${CIEL_VERSION}"
          # ciel is the maintained successor to volare -- same open_pdks build
          # format and CLI shape, but volare's PDK release feed stopped in
          # Aug 2025 while ciel's is current. It installs into ~/.ciel/<variant>,
          # one of sim/harness/pdk.py's built-in search roots, so no
          # GF180_PDK_PATH / PDK_ROOT wiring is needed. Leaving PDK_ROOT unset
          # is load-bearing: ciel would install there instead if it were set.
          #
          # `-l` takes exactly one library per flag (`ciel enable --help`), so
          # PDK_LIBRARIES' space-separated names each become their own flag.
          lib_flags=()
          for lib in ${PDK_LIBRARIES}; do
            lib_flags+=(-l "${lib}")
          done
          ciel enable --pdk-family gf180mcu "${lib_flags[@]}" "${PDK_VERSION}"

      - name: Environment probe (must report ngspice OK and PDK OK)
        run: python3 sim/run_corners.py --check-env

      - name: Install xschem (the schematic netlister)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xschem
          xschem --version 2>&1 | head -n 2

      # Fails if design/*.spice no longer matches design/xschem/*.sch. Writes
      # nothing: --check exports to a temp dir and diffs. The gf180mcu symbol
      # library it needs lives at <variant>/libs.tech/xschem/symbols, which
      # rides in the PDK release's `common` tarball provisioned above.
      - name: Schematic-vs-netlist staleness guard
        run: python3 design/netlist.py --check

      # --require-pdk turns the PR path's skip into a failure, so a broken
      # ngspice or PDK provisioning step above shows up as a red job instead of
      # a green run that quietly skipped stages 4-5.
      - name: Harness acceptance test including the PDK-dependent stages
        run: sim/selftest.sh --require-pdk

      # The layout half of the same idea. klayout-tools brings its own KLayout
      # Python module, so this needs no GUI, no Qt and no apt package -- but it
      # does need the PDK provisioned above, which is why it lives here and not
      # on the PR path (where layout/verify.py self-skips).
      #
      # --require-tools turns that skip into a failure. Expect this step to be
      # the first place a klayout-tools upgrade shows up: if a new klt version
      # changes a verdict, a rule id, or the shape of a report, this goes red
      # and layout/reports/ needs regenerating with `layout/verify.py --write`.
      # That is the point of committing the reports.
      #
      # (History: until #281 this was pinned to an explicit git ref/SHA, for
      # the reason below; see the last paragraph of this block for the
      # current, released pin.) Pinned to an explicit git ref/SHA rather than
      # a PyPI release: the latest published release (v0.2.0, 2026-08-04)
      # predates the gf180mcu
      # digital synthesize/place-and-route flow, `klt pex`, and `klt yield`
      # (#142). `klt --version` alone cannot distinguish this build from the
      # PyPI one -- see layout/README.md's "Pinning the tool" section --
      # which is why the ref is spelled out here instead of floating on
      # `main`/`--upgrade`.
      #
      # e501e261c1ac9b96a08e2c3569bf6207123a5b6a (#170) supersedes the prior
      # a482d393 pin. The commit that actually motivated the bump is
      # klayout-tools#1114: the fix for the DEF->GDS merge's database-unit
      # defect (klayout-tools#1090) that made every DEF-derived shape in
      # `klt place-and-route`'s merged GDS come out 2x its true size.
      # e501e261 is one commit past that fix rather than exactly at it,
      # picking up klayout-tools#1115 too (a DRC deck correctness fix,
      # scoping gf180mcu's DF.1a/DF.3a rules to Dualgate) with no other gap
      # in between -- see #170. Between a482d393 and #1114 on `main` also
      # sits klayout-tools#1113 (gf180mcu well/substrate-tap derivation from
      # drawn Nplus/Pplus geometry): not something #170 went looking for,
      # but unavoidable on the way to #1114, and its side effect is visible
      # in this repository's own committed reports (`layout/verify.py`'s
      # `device.body_unverified` expectation dropped from 2 to 1 per
      # fixture -- see that file's own comment for why, and
      # layout/README.md's "Bulk terminals are approximated").
      #
      # 9c71bb6741f20be19bf94b847832803505042ec6 (#171) supersedes that
      # e501e261 pin. It is klayout-tools#1120 exactly -- the commit that
      # adds `klt place-and-route`'s optional `request.power` block
      # (tapcell/endcap insertion, add_global_connection/global_connect,
      # pdngen straps, post-route filler_placement), the capability
      # klayout-tools#1091 asked for and `layout/digital/build.py` now
      # sends. Ancestry re-verified against the live upstream history before
      # pinning (2026-08-17, `gh api .../compare/e501e261...9c71bb67` ->
      # `ahead_by: 2, behind_by: 0`): the bump is strictly forward, and the
      # one commit between them is klayout-tools#1118, a refactor that
      # dedupes two provenance helpers into a shared module.
      #
      # Pinned *at* #1120 rather than at upstream `main` on purpose. `main`
      # was three commits further along when this was set
      # (klayout-tools#1119/#1124/#1126), and #1119 adds gf180mcu per-flavour
      # MOS marker and nfet_06v0/pfet_06v0 model binding to `klt extract` --
      # exactly the surface every committed `layout/reports/*.extract.json`
      # and `*.lvs.json` here is an expectation over, and the surface
      # klayout-tools#1113 moved under #170. Whether it actually changes
      # those reports was not evaluated: taking the bump means regenerating
      # and re-reading that evidence, which is its own piece of work and not
      # this issue's. So this pin deliberately stops one commit short of it.
      #
      # 59c2a2873c171cf5064255b64ff3719d4d54eaa9 (#210) supersedes that
      # 9c71bb67 pin, 326 commits forward (`gh api .../compare/9c71bb67...
      # 59c2a287` -> `ahead_by: 326, behind_by: 0`, confirmed 2026-09-06).
      # This bump exists to compose `layout/digital/trng_top.gds` (the
      # `klt place-and-route`-produced digital section, #170/#171) into
      # this repository's own floorplan next to its guard ring, which two
      # database-unit (dbu) defects blocked in turn:
      #
      # - klayout-tools#1496: `klt gen <generator>` (guard rings, and every
      #   region's own `klt gen`/`gen-compose`-descended real content --
      #   `ring1`/`ring2`/`combiner_sampler`) wrote its output at a
      #   hardcoded 0.001 dbu regardless of PDK, while `klt place-and-
      #   route`'s DEF/GDS merge correctly derives its own dbu from the
      #   resolved PDK's tech LEF (0.0005 for gf180mcu's `DATABASE MICRONS
      #   2000`). `gen-compose` refuses to place two blocks at different
      #   dbus, so composing `trng_top.gds` next to any freshly generated
      #   guard ring failed outright. Fixed by merged klayout-tools#1512
      #   (commit 8b8c51466622a6b155ccfb9fb0bcb789c9c330e0): `klt gen` now
      #   also derives its output dbu from the PDK's tech LEF.
      # - klayout-tools#1514: #1512's fix, once re-pinned and tested here,
      #   turned out to only relocate the mismatch rather than remove it --
      #   `ring1`/`ring2`/`combiner_sampler`'s own committed assemblies are
      #   `klt draw`-descended geometry, which has no PDK awareness and is
      #   still hardcoded at the old 0.001 dbu with no override. Re-pinning
      #   `klt` past #1512 alone regressed those three previously-passing
      #   compositions against every freshly generated (now 0.0005) guard
      #   ring. Fixed by merged klayout-tools#1516 (commit
      #   59c2a2873c171cf5064255b64ff3719d4d54eaa9, this pin): `gen-compose`
      #   now resolves the finest dbu among a request's blocks and
      #   losslessly rescales coarser ones onto it via an exact integer
      #   `ICplxTrans` magnification (0.001 -> 0.0005 is an exact 2:1
      #   ratio) instead of refusing on any mismatch; a genuinely
      #   non-integer-ratio mismatch still refuses.
      #
      # Both defects, and this repository's own re-verification that the
      # #1516 fix resolves all four regions' compositions together
      # (`digital`, `ring1`, `ring2`, `combiner_sampler`), are tracked in
      # #210/#209.
      #
      # 3fbb4478e3017c8d8580fba4feb08bc386b4c925 (#217) supersedes the
      # 59c2a287 pin above, 19 commits forward (`gh api .../compare/
      # 59c2a2873c171cf5064255b64ff3719d4d54eaa9...3fbb4478e3017c8d8580fba4feb08bc386b4c925`
      # -> `ahead_by: 19, behind_by: 0`, confirmed 2026-09-11). This bump
      # exists for merged klayout-tools#1543 ("feat(extract): disclose
      # positional net/pin identity for repeated-instance name collisions",
      # closing klayout-tools#1540): `klt extract`'s flat naming had always
      # collapsed a repeated leaf-cell instance array's genuinely distinct
      # internal nets (e.g. `layout/rings/ro_ring11/`'s ten inter-stage
      # nodes plus its one true external `ro` boundary pin) onto
      # identically-named `.SUBCKT` header entries, with no documented way
      # to tell which position was which. #1543 adds three additive
      # `nets[]` fields -- `net_id` (the net's own cluster id), `pin_index`
      # (its `.SUBCKT`/instance-line port position) and
      # `label_positions_um` (every drawn label naming that net, in the
      # top cell's own coordinates) -- giving a caller with independent
      # floorplan knowledge (this repository's own `build.py` placement
      # code) a positive way to identify a specific collided entry. This is
      # what makes `layout/pex/build.py`'s routing-level composition path
      # (issue #217, on top of #17's leaf-cell-only path) possible: see
      # that module's own docstring, "Routing-level composition", for how
      # each assembled block's true external ports are identified.
      #
      # klayout-tools==0.6.0 (#281, per DR-0026 as amended) supersedes the
      # 3fbb4478 git pin above -- and ends this file's git-SHA era: 0.6.0 is a
      # tagged PyPI release (tag v0.6.0 -> commit
      # c622e8addb362491664d44ba4d717f354ca88bbd, 469 commits forward of
      # 3fbb4478 with `behind_by: 0`, confirmed 2026-10-08), so the pin is
      # reproducible with a plain `pip install` and no longer needs the
      # "latest release predates the flow" caveat at the top of this block.
      # The wheel records the commit it was built from (`klt version
      # --format json` -> git_commit/git_tag/is_release, klayout-tools#1202),
      # which is what layout/reports/environment.json's `klt_origin` now
      # reads for a registry install. The bump exists for klayout-tools#1969
      # (`klt lvs` populates `provenance.input.content_hash`, so
      # signoff/block-manifest.json's `4.analog` citation can carry a pin)
      # and brings `power_connectivity`/`body_verification` blocks into
      # every LVS report. Measured against all 13 layout/verify.py fixtures
      # (DR-0026's amendment records the full diff): no DRC verdict, rule
      # count, device/net count, extracted netlist or LVS status moved;
      # `device.body_unverified` goes 1 -> 2 per LVS fixture because
      # klayout-tools#2048 discloses the PMOS half per device again.
      #
      # `klayout==0.30.10` is pinned alongside it because it is the engine
      # this release records it was tested against (`klt version`'s
      # `klayout_version_expected`); left floating, pip resolves 0.30.12,
      # every report carries `provenance.klayout_version_mismatch: true`,
      # and a future KLayout release would move `provenance.klayout_version`
      # in every committed report. Measured: 0.30.10 vs 0.30.12 changes only
      # those two version fields, nothing else.
      - name: Install klayout-tools (the DRC/LVS driver)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade \
            "klayout-tools==0.6.0" "klayout==0.30.10"
          klt --version
          klt version --format json

      # `klt synthesize` (design/synth.py) shells out to `yosys`, the same
      # way this flow already shells out to `xschem`/`klt` -- floating
      # rather than a version pin, and for the same reason given above for
      # xschem: it is a netlister, and a version bump is meant to turn
      # `design/synth.py --check` red (loud) rather than drift unnoticed.
      #
      # This used to float on Ubuntu's own distro `yosys` package (0.33 on
      # 24.04), on the premise -- `klayout_tools.synthesize`'s own module
      # docstring -- that 0.33 is the reference "older build" its
      # graceful-degradation paths (`-dont_use` exclusion,
      # `sequential_area_um2`) are already written and tested against. That
      # premise turned out to be true for those two paths but false for a
      # third: measured live (#196), `klt synthesize --format json` against
      # this repo's own `trng_top` (a hierarchical top instantiating four
      # child modules, never flattened -- see design/synth.py's "One
      # netlist, not five" docstring section) crashes on every single
      # invocation under Yosys 0.33, with an unhandled `KeyError('area')`
      # traceback on stderr instead of a clean JSON error envelope, because
      # 0.33's `stat -json` omits the top module's own `area` key entirely
      # when -- as here -- none of its *directly* owned cells are
      # liberty-mapped primitives (they are all un-flattened submodule
      # instances, so its own contribution is exactly zero and 0.33 drops
      # the key rather than emitting `0.0`). This is a klayout-tools bug
      # (`run_synthesize()` indexes `module_stats["area"]` unguarded, with
      # no fallback to the report's own whole-design `area` rollup, unlike
      # the module-key-miss case `_read_stats()` already falls back on) --
      # filed upstream at 2AMLogic/klayout-tools#1262, and NOT
      # patched here (out of this repo's scope; see CLAUDE.md's friction
      # protocol). Yosys 0.67+ does not hit it: verified live (#196)
      # against PyPI's `yowasp-yosys`, whose `stat -json` reports a correct,
      # non-zero rolled-up `area` for the same hierarchical `trng_top`
      # request -- matching the `engine_version: "0.68+post"` this repo's
      # own committed `design/trng_top/trng_top.synth.json` already
      # recorded (that netlist was never built against the distro package
      # to begin with). So the floor moves to `yowasp-yosys`: still no
      # version pin (`--upgrade`, same loud-drift intent as before), just a
      # different, actually-working channel. `yowasp-yosys` installs its
      # console script as `yowasp-yosys`, not `yosys` -- `klt synthesize`
      # (and every caller in this repo) invokes the latter by name, so the
      # step below symlinks one to the other.
      #
      # `yowasp-yosys` is a WASI-sandboxed build (real Yosys compiled to
      # WebAssembly, run under `wasmtime`): it only has filesystem access
      # under the invoking directory, never `/tmp` -- the same constraint
      # `layout/digital/lvs.py`'s own `_yosys_netlist()` already documents
      # and designs around, and why `design/synth.py`'s own scratch
      # directory (`design/.work/`, `WORK_DIR`) moved off the OS temp dir in
      # the same change (#196).
      - name: Install yosys (the digital synthesis engine)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --upgrade yowasp-yosys
          yosys_bin="$(command -v yowasp-yosys)"
          ln -sf "${yosys_bin}" "$(dirname "${yosys_bin}")/yosys"
          yosys -V

      # Fails if design/trng_top/trng_top.synth.{v,json} no longer match
      # what `klt synthesize` produces from the current RTL -- the digital
      # analogue of the schematic-vs-netlist guard above (#143). Needs the
      # `gf180mcu_fd_sc_mcu9t5v0` standard-cell library, provisioned via
      # PDK_LIBRARIES above alongside the primitive library. Writes nothing
      # git-visible: --check synthesizes into the gitignored `design/.work/`
      # scratch directory and diffs against the committed files.
      - name: Digital synthesis staleness guard
        run: python3 design/synth.py --check

      - name: Layout DRC/LVS flow including the PDK-dependent stages
        run: python3 layout/verify.py --require-tools

      # The floorplan analogue of the DRC/LVS step above (#227): the same
      # klt-version-changes-a-verdict risk applies to
      # layout/floorplan/reports/, but until now nothing on any path promoted
      # its self-skip-without-PDK behavior to a failure -- layout/verify.py
      # got exactly this treatment here, while layout/floorplan/floorplan.py
      # only ever ran self-skipping, on the PR path (ci.yml). That left the
      # floorplan's deck/tool provenance invisible to CI, surfacing only when
      # someone happened to regenerate locally and diff (as happened between
      # #226 and #230). --require-tools closes that blind spot the same way
      # it does above: expect this to go red on a klt upgrade that moves a
      # floorplan verdict, region geometry, or report shape, the same as the
      # step above; regenerate layout/floorplan/reports/ with
      # `layout/floorplan/floorplan.py --write` when that happens.
      - name: Floorplan flow including the PDK-dependent stages
        run: python3 layout/floorplan/floorplan.py --require-tools

      # The committed post-route SDF's regeneration guard (#374).
      # `layout/digital/gen_sdf.py --check` re-runs OpenSTA over the committed
      # `trng_top.pnr.v` and the provisioned liberty deck, then compares the
      # result with `trng_top.sdf` and `reports/sdf_export.json`. The compare
      # (wall-clock DATE normalised, byte digest verified, report diffed) is
      # that script's own; nothing here re-implements or loosens it. It never
      # writes a committed artefact -- fresh output goes to the gitignored
      # `layout/.work/gen-sdf/` -- and a missing OpenROAD, container or PDK
      # file is an environment failure (exit 3), never a skip.
      #
      # OpenROAD comes from the digest-pinned `openroad/orfs` image via
      # `layout/openroad_docker.sh` (the script falls back to it when no
      # native `openroad` is on PATH; ubuntu-latest ships docker). The image
      # bind-mounts the checkout and ~/.ciel at their host paths, so the probe
      # below fails fast, with a readable message, if the provisioned PDK's
      # liberty/LEF files are not visible *inside* the container, rather than
      # surfacing as an opaque OpenSTA error halfway through the comparison.
      - name: OpenROAD and PDK reachability probe (native or pinned container)
        run: |
          set -euo pipefail
          mkdir -p layout/.work
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from layout.digital import gen_sdf
          pdk = gen_sdf.resolve_pdk()
          if pdk is None:
              sys.exit("FAIL: no gf180mcu PDK install found")
          lines = []
          for path in gen_sdf._lib_paths(pdk).values():
              lines.append(
                  f'if {{![file isfile {path}]}} {{puts "FAIL: not visible '
                  f'to openroad: {path}"; exit 1}}'
              )
          lines.append('puts "OK: PDK files visible to openroad"')
          open("layout/.work/probe.tcl", "w").write("\n".join(lines) + "\n")
          PY
          if command -v openroad >/dev/null 2>&1; then
            openroad_cmd=(openroad)
          else
            openroad_cmd=(./layout/openroad_docker.sh)
          fi
          "${openroad_cmd[@]}" -version
          "${openroad_cmd[@]}" -no_init -exit "$PWD/layout/.work/probe.tcl"

      - name: Committed SDF regeneration guard
        run: npm run check:digital-sdf

      # Tap-distance report freshness (#458). Re-measures the committed
      # trng_top.gds with the current layout/digital/tap_distance.py and fails
      # if layout/digital/reports/tap-distance.json no longer follows from it,
      # which the hash-only unit tests cannot see after an algorithm-only
      # change. Needs only the `klayout` module installed above;
      # --require-tools turns a missing module into a failure, never a skip.
      # Read-only: --check writes nothing. It checks report freshness only; the
      # report's own physical verdict is not gated here.
      #
      # `if: always()` so this reports its own result even when an earlier,
      # unrelated validation step (floorplan, SDF, ...) failed. It still needs
      # the klayout install, so it cannot run meaningfully if that failed.
      - name: Tap-distance report regeneration guard
        if: always()
        run: python3 layout/digital/tap_distance.py --check --require-tools

      # `if: always()` so the no-write contract is still enforced when an
      # earlier verification step failed (an unrelated failure must not hide
      # a record write). Gated on a successful checkout: without a working
      # tree, `git status` would fail with a misleading error, so skip then.
      # Cancellation or runner loss cannot be covered by this.
      - name: Assert no evidence records were written
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- sim/records)" ]; then
            echo "FAIL: this job modified sim/records/. Evidence records are"
            echo "      append-only and minted deliberately (sim/README.md);"
            echo "      CI must never write them."
            git status --porcelain -- sim/records
            exit 1
          fi
          echo "OK: sim/records/ untouched"
